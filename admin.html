<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Attendance</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="container">
    <div class="card">
      <h1>🔐 Admin Login</h1>
      <input type="email" id="adminEmail" placeholder="Admin Email" />
      <input type="password" id="adminPassword" placeholder="Password" />
      <button onclick="adminLogin()">Login</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="container hidden">

    <!-- Create Session -->
    <div class="card">
      <h2>📝 Create Attendance Session</h2>
      <input type="text" id="subject" placeholder="Subject Name" />
      <input type="date" id="date" />
      <label>Close After (minutes):</label>
      <input type="number" id="timer" placeholder="e.g. 10" min="1" />
      <button onclick="createSession()">🚀 Create & Get Link</button>
    </div>

    <!-- Generated Link -->
    <div class="card hidden" id="linkCard">
      <h2>🔗 Share This Link</h2>
      <div class="link-box">
        <p id="generatedLink"></p>
        <button onclick="copyLink()">📋 Copy Link</button>
      </div>
      <div id="countdown" class="timer"></div>
      <button onclick="closeSession()" id="closeBtn" class="red-btn">
        ⏹ Close Now
      </button>
    </div>

    <!-- View Attendance -->
    <div class="card hidden" id="attendanceCard">
      <h2>✅ Attendance List</h2>
      <div id="sessionInfo" class="session-info"></div>
      <div id="attendanceList"></div>
      <div class="action-btns">
        <button onclick="copyAllNames()">📋 Copy All Names</button>
        <button onclick="downloadCSV()">⬇️ Download CSV</button>
      </div>
    </div>

    <!-- Past Sessions -->
    <div class="card">
      <h2>📂 Past Sessions</h2>
      <div id="pastSessions"></div>
    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
